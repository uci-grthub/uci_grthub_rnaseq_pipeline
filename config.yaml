# Configuration file for RNA-seq Snakemake workflow

# Input/Output paths
paths:
  data: "data/FASTQ"  # Directory containing FASTQ files
  output: "output"

# Reference files
references:
  adapters: "/dfs9/ucightf-lab/kstachel/TOOLS/Trimmomatic-0.39/adapters/TruSeq3-PE-2.fa"
  hisat2_index: "/dfs8/commondata/hisat2/references/grch38_snp_tran/genome_snp_tran"
  gtf: "/dfs8/commondata/hisat2/references/grch38_snp_tran/Homo_sapiens.GRCh38.84.gtf"
  salmon_index: "/dfs9/ucightf-lab/projects/REFERENCES/human/Salmon/GRCh38_v33_salmon_index"

# Tool paths
tools:
  trimmomatic: "/dfs9/ucightf-lab/kstachel/TOOLS/Trimmomatic-0.39/trimmomatic-0.39.jar"

# Parameters
params:
  trimmomatic:
    illuminaclip: "2:30:10:8:true"
    sliding_window: "4:15"
    min_length: 20
  hisat2:
    rna_strandness: "RF"  # For TruSeq mRNA Stranded libraries
  salmon:
    library_type: "ISR"  # For TruSeq mRNA Stranded PE libraries
  feature_counts:
    strandness: 2  # For stranded libraries (first read reverse)
  cpus: 8

deseq2:
  metadata: "metadata/metadata.csv"
  infer_metadata_from_fastq: true  # auto-populate a default metadata file from FASTQ filenames if missing
  comparisons_config: "proj_src/deseq2_comparisons.yaml"  # line-group comparisons + run variants (see notes.md)

limma_voom:
  # Same comparisons config as deseq2 on purpose: identical line_groups,
  # comparisons and run_variants means the two methods produce matching
  # contrasts that can be compared directly.
  comparisons_config: "proj_src/deseq2_comparisons.yaml"
  # duplicateCorrelation blocking factor. Replicate differentiations of one NPC
  # line are biological replicates and are correlated with each other, so the
  # line is the blocking unit; it is nested inside line_group, which is the
  # factor being tested. voom and duplicateCorrelation are run twice, as the
  # limma User's Guide prescribes, since each estimate depends on the other.
  # Set to "none" to fit all samples as independent.
  block_var: "line"


# Descriptors used to build the GEO/SRA submission sheets. These are constant
# across the run rather than per-sample, so they live here instead of in
# metadata.csv.
ncbi:
  tissue: "colon"
  instrument_model: "Illumina NovaSeq 6000"
