# Supplementary config: per-species reference paths.
# Loaded in addition to config.yaml so that samples from different organisms
# (see metadata/metadata.csv "species" column) are aligned/quantified/counted
# against the correct genome instead of all defaulting to human GRCh38.
#
# Added after xR098-L1-G5-P070/P071 were found to be mouse libraries that had
# been run through the human HISAT2 index (near-0% alignment rate).

# No default_species here: a sample with a blank metadata `species` stops the
# run. Set one per project in config.local.yaml (e.g. `default_species: macaque`).

species_references:
  human:
    organism: "Homo sapiens"
    genome_build: "GRCh38"
    annotation: "Ensembl release 84"
    hisat2_index: "/dfs8/commondata/hisat2/references/grch38_snp_tran/genome_snp_tran"
    gtf: "/dfs8/commondata/hisat2/references/grch38_snp_tran/Homo_sapiens.GRCh38.84.gtf"
    salmon_index: "/dfs9/ucightf-lab/kstachel/REFERENCES/human/Salmon/GRCh38_v33_salmon_index"
    # Gene symbols and biotypes, as an ensembldb EnsDb built from the GTF
    # above by src/build_gene_annotation.sh. It is a pure function of the GTF,
    # so it lives beside the references and is shared by every project using
    # this annotation rather than rebuilt per project. The human GTF sits on
    # read-only commondata, so its database goes in the writable tree instead.
    # ensdb_organism needs an underscore and ensdb_genome must be a bare build
    # name -- ensembldb's spellings, not the human-readable ones above.
    ensdb: "/dfs9/ucightf-lab/kstachel/REFERENCES/human/Homo_sapiens.GRCh38.84.EnsDb.sqlite"
    ensdb_organism: "Homo_sapiens"
    ensdb_genome: "GRCh38"
    ensdb_version: 84
  mouse:
    organism: "Mus musculus"
    genome_build: "GRCm38 (mm10)"
    annotation: "GENCODE vM24"
    hisat2_index: "/dfs9/ucightf-lab/kstachel/REFERENCES/mouse/Hisat2/GRCm38/gencode.vM24.annotation.genome_tran"
    gtf: "/dfs9/ucightf-lab/kstachel/REFERENCES/mouse/gencode.vM24.annotation.gtf"
    salmon_index: "/dfs9/ucightf-lab/kstachel/REFERENCES/mouse/salmon/salmon_index"
    ensdb: "/dfs9/ucightf-lab/kstachel/REFERENCES/mouse/gencode.vM24.annotation.EnsDb.sqlite"
    ensdb_organism: "Mus_musculus"
    ensdb_genome: "GRCm38"
    ensdb_version: 100
  # Built by src/build_macaque_reference.sh (download, then index) and
  # src/build_gene_annotation.sh. Mmul_10 is rhesus; it is also the usual
  # reference for cynomolgus libraries until a fascicularis key is added.
  macaque:
    organism: "Macaca mulatta"
    genome_build: "Mmul_10 (rheMac10)"
    annotation: "Ensembl release 116"
    hisat2_index: "/dfs9/ucightf-lab/kstachel/REFERENCES/macaque/Mmul_10/hisat2/genome_tran"
    gtf: "/dfs9/ucightf-lab/kstachel/REFERENCES/macaque/Mmul_10/Macaca_mulatta.Mmul_10.116.gtf"
    salmon_index: "/dfs9/ucightf-lab/kstachel/REFERENCES/macaque/Mmul_10/salmon_index"
    ensdb: "/dfs9/ucightf-lab/kstachel/REFERENCES/macaque/Mmul_10/Macaca_mulatta.Mmul_10.116.EnsDb.sqlite"
    ensdb_organism: "Macaca_mulatta"
    ensdb_genome: "Mmul_10"
    ensdb_version: 116
  # NCBI RefSeq annotation: gene_id is the gene symbol (HTR2A, LOC...), not an
  # Ensembl ID, and transcript IDs are RefSeq accessions (NM_/XM_).
  macaque_t2t:
    organism: "Macaca mulatta"
    genome_build: "T2T-MMU8v2.0 (GCF_049350105.2)"
    annotation: "NCBI RefSeq GCF_049350105.2-RS_2025_08"
    hisat2_index: "/dfs9/ucightf-lab/kstachel/REFERENCES/macaque/T2T-MMU8v2.0/hisat2/genome_tran"
    gtf: "/dfs9/ucightf-lab/kstachel/REFERENCES/macaque/T2T-MMU8v2.0/GCF_049350105.2_T2T-MMU8v2.0_genomic.gtf"
    salmon_index: "/dfs9/ucightf-lab/kstachel/REFERENCES/macaque/T2T-MMU8v2.0/salmon_index"
    ensdb: "/dfs9/ucightf-lab/kstachel/REFERENCES/macaque/T2T-MMU8v2.0/GCF_049350105.2_T2T-MMU8v2.0_genomic.EnsDb.sqlite"
    ensdb_organism: "Macaca_mulatta"
    ensdb_genome: "T2T-MMU8v2.0"
    ensdb_version: 1
