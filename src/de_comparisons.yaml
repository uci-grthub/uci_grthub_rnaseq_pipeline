# Differential-expression design for the MaccF HTR2A knockdown study, read by
# src/deseq2_analysis.R (see metadata/notes.md and metadata/notes_response.md).
#
# Design: 4 animals, 8 brain regions each, one library per animal x region,
# sequenced on two lanes that the script sums (metadata `library` column).
#   Control  NHP7 (13010671)            n = 1
#   COG301   NHP3 (39544), NHP4 (39856) n = 2
#   CPG201   NHP1 (39851)               n = 1
# In metadata.csv the group is `condition`, the animal `nhp`, the region `region`.
#
# Each comparison fits `~ region + <factor>` on the listed regions -- region is
# the blocking factor -- and contrasts every level of <factor> against
# `reference`. A positive log2FoldChange means higher than the reference.

# Region tiers by expected HTR2A baseline. `primary` is the pre-specified test
# set; the others are reported descriptively.
region_sets:
  primary: [OB, EC, mPFC, ACC, IFC]
  moderate: [HIPP, AMY]
  low: [CB]
  all: [OB, EC, mPFC, ACC, IFC, HIPP, AMY, CB]

comparisons:
  # Primary endpoint: treatment group vs control, blocked on region
  - name: primary_group
    regions: primary
    factor: condition
    reference: Control
  # Per-animal effects, to check that the two COG301 animals agree
  - name: primary_animal
    regions: primary
    factor: nhp
    reference: NHP7
  # Descriptive: all 8 regions
  - name: all_regions_group
    regions: all
    factor: condition
    reference: Control

# Genes reported in the target tables. Symbols are resolved against the GTF the
# counts were made from.
target_genes: [HTR2A]
# Genes the treatment should not affect but that share HTR2A's cellular
# distribution; HTR2A log2FC is also reported relative to their mean.
reference_genes: [HTR1A, HTR2C, BCL11B, FEZF2, SLC17A7]

# Cell-composition marker sets. A sample's score is the mean log2 normalised
# count of the set; a treated sample whose score differs from the control's in
# the same region by more than `composition_flag_log2` is flagged.
composition_markers:
  neuron: [RBFOX3, SNAP25, SYT1]
  excitatory: [SLC17A7, SATB2]
  inhibitory: [GAD1, GAD2]
  astrocyte: [GFAP, AQP4, SLC1A3]
  oligodendrocyte: [MBP, PLP1, MOG]
  microglia: [AIF1, CX3CR1, P2RY12]
composition_flag_log2: 1
